name: Publish Image

# Builds the upliftos-admission webhook server and publishes it to Docker Hub.
#
# Why Docker Hub and not GHCR: a customer's Kubernetes cluster pulls this image
# during the UpliftOS connect flow, BEFORE any UpliftOS pull credentials exist in
# the namespace — so it must be anonymously pullable. The upliftos GitHub org
# disables public packages org-wide, so a public GHCR package is not available;
# Docker Hub is unaffected by that policy. (ECR Public would need new IAM + a
# vanity-alias approval for no added benefit.)
#
# push / pull_request → go test + a multi-arch BUILD (no push): proves it still
#   compiles and images, and works on forks/PRs with no secrets.
# workflow_dispatch (tag input, default v1) → BUILD + PUSH the immutable release
#   tag the UpliftOS bootstrap manifest pins.
#
# Required repo secrets for publishing (Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME — a Docker Hub account with push rights on the org
#   DOCKERHUB_TOKEN    — a Docker Hub *access token* (not the password)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Immutable release tag to publish (e.g. v1)'
        required: true
        default: 'v1'

permissions:
  contents: read

env:
  # The exact ref bootstrap-manifest.ts pins.
  IMAGE: docker.io/upliftos/upliftos-admission

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Decide tags + whether to push
        id: meta
        run: |
          SHORT="sha-${GITHUB_SHA::12}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:${{ github.event.inputs.tag }},${IMAGE}:${SHORT}" >> "$GITHUB_OUTPUT"
          else
            # push / pull_request: build only, never publish.
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push when publishing)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
